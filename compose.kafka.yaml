# EP5: Kafka in ZooKeeper mode (Confluent Platform 7.9.x = Apache Kafka 3.9, the last line with ZooKeeper).
# Independent from RabbitMQ/MySQL: no shared containers, networks or volumes.
# Only the EXTERNAL listeners are published, and only on loopback; ZooKeeper (2181/2888/3888) stays internal.
name: pedidos360-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.9.10@sha256:1a870111c6e861f1e6015094fac902779981edb5cb1d2ad6b7437d2a6b8ba064
  labels: { Project: Pedidos360, Purpose: ep5 }
  networks: [kafka]
  tmpfs: [/etc/zookeeper/secrets]   # unused image VOLUME; avoids anonymous volumes
  mem_limit: 320m
  restart: unless-stopped
  healthcheck:
    # Healthy only while this node is part of a quorum (leader or follower).
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2181 && echo srvr >&3 && grep -qE '^Mode: (leader|follower)' <&3"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 20s

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 10
  ZOOKEEPER_SYNC_LIMIT: 5
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  ZOOKEEPER_ADMIN_ENABLE_SERVER: "false"
  KAFKA_HEAP_OPTS: "-Xmx256m"
  # Four-letter words: srvr (E-02 leader/follower), ruok, dump (broker health: ephemeral /brokers/ids nodes).
  KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok,dump"

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.10@sha256:07c3d60362e67c296f7f34b690b1240e5ecdcde4a84f5e73cab320fb4041f58c
  labels: { Project: Pedidos360, Purpose: ep5 }
  networks: [kafka]
  tmpfs: [/etc/kafka/secrets]   # unused image VOLUME; avoids anonymous volumes
  mem_limit: 896m
  restart: unless-stopped
  depends_on:
    zookeeper-1: { condition: service_healthy }
    zookeeper-2: { condition: service_healthy }
    zookeeper-3: { condition: service_healthy }

# Table 5 of the report (cluster configuration).
x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

services:
  zookeeper-1:
    <<: *zookeeper
    container_name: zookeeper-1
    hostname: zookeeper-1
    environment: { <<: *zookeeper-env, ZOOKEEPER_SERVER_ID: 1 }
    volumes: [zookeeper-1-data:/var/lib/zookeeper/data, zookeeper-1-log:/var/lib/zookeeper/log]
  zookeeper-2:
    <<: *zookeeper
    container_name: zookeeper-2
    hostname: zookeeper-2
    environment: { <<: *zookeeper-env, ZOOKEEPER_SERVER_ID: 2 }
    volumes: [zookeeper-2-data:/var/lib/zookeeper/data, zookeeper-2-log:/var/lib/zookeeper/log]
  zookeeper-3:
    <<: *zookeeper
    container_name: zookeeper-3
    hostname: zookeeper-3
    environment: { <<: *zookeeper-env, ZOOKEEPER_SERVER_ID: 3 }
    volumes: [zookeeper-3-data:/var/lib/zookeeper/data, zookeeper-3-log:/var/lib/zookeeper/log]

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    hostname: kafka-1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:29092,EXTERNAL://127.0.0.1:19092"
    volumes: [kafka-1-data:/var/lib/kafka/data]
    healthcheck: &kafka-health
      # Healthy when both listeners accept connections and the broker's ephemeral
      # registration /brokers/ids/<id> exists in ZooKeeper (no extra JVM inside the container).
      test: ["CMD", "bash", "-c", "id=$${KAFKA_BROKER_ID}; ext=$${KAFKA_LISTENERS##*:}; (exec 3<>/dev/tcp/127.0.0.1/29092) && (exec 4<>/dev/tcp/127.0.0.1/$${ext}) && for z in zookeeper-1 zookeeper-2 zookeeper-3; do echo dump | nc -w 2 $${z} 2181 2>/dev/null | grep -q \"/brokers/ids/$${id}$$\" && exit 0; done; exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
  kafka-2:
    <<: *kafka
    container_name: kafka-2
    hostname: kafka-2
    ports: ["127.0.0.1:19093:19093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:29092,EXTERNAL://127.0.0.1:19093"
    volumes: [kafka-2-data:/var/lib/kafka/data]
    healthcheck: *kafka-health
  kafka-3:
    <<: *kafka
    container_name: kafka-3
    hostname: kafka-3
    ports: ["127.0.0.1:19094:19094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:29092,EXTERNAL://127.0.0.1:19094"
    volumes: [kafka-3-data:/var/lib/kafka/data]
    healthcheck: *kafka-health

volumes:
  zookeeper-1-data: { name: pedidos360-kafka-zookeeper-1-data, labels: { Project: Pedidos360, Purpose: ep5 } }
  zookeeper-1-log: { name: pedidos360-kafka-zookeeper-1-log, labels: { Project: Pedidos360, Purpose: ep5 } }
  zookeeper-2-data: { name: pedidos360-kafka-zookeeper-2-data, labels: { Project: Pedidos360, Purpose: ep5 } }
  zookeeper-2-log: { name: pedidos360-kafka-zookeeper-2-log, labels: { Project: Pedidos360, Purpose: ep5 } }
  zookeeper-3-data: { name: pedidos360-kafka-zookeeper-3-data, labels: { Project: Pedidos360, Purpose: ep5 } }
  zookeeper-3-log: { name: pedidos360-kafka-zookeeper-3-log, labels: { Project: Pedidos360, Purpose: ep5 } }
  kafka-1-data: { name: pedidos360-kafka-1-data, labels: { Project: Pedidos360, Purpose: ep5 } }
  kafka-2-data: { name: pedidos360-kafka-2-data, labels: { Project: Pedidos360, Purpose: ep5 } }
  kafka-3-data: { name: pedidos360-kafka-3-data, labels: { Project: Pedidos360, Purpose: ep5 } }

networks:
  kafka:
    name: pedidos360-kafka
    labels: { Project: Pedidos360, Purpose: ep5 }
