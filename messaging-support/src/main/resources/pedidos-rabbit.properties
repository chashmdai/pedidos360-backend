# Single source of topology names, imported explicitly by participating services.
pedidos.messaging.exchange=pedidos360.orders.events.v1
pedidos.messaging.routing-key=order.registered.v1
pedidos.messaging.queue=pedidos360.receipts.order-registered.v1
pedidos.messaging.dead-exchange=pedidos360.receipts.errors.v1
pedidos.messaging.dead-routing-key=receipt.failed.v1
pedidos.messaging.dead-queue=pedidos360.receipts.failed.v1
pedidos.messaging.insights.topic-exchange=pedidos360.orders.insights.v1
pedidos.messaging.insights.audit-queue=pedidos360.audit.order-registered.v1
pedidos.messaging.insights.audit-pattern=order.registered.*
pedidos.messaging.insights.audit-dead-exchange=pedidos360.audit.errors.v1
pedidos.messaging.insights.audit-dead-queue=pedidos360.audit.failed.v1
pedidos.messaging.insights.audit-dead-key=audit.failed.v1
pedidos.messaging.insights.sales-queue=pedidos360.sales.order-registered.v1
pedidos.messaging.insights.sales-pattern=*.registered.v1
pedidos.messaging.insights.sales-dead-exchange=pedidos360.sales.errors.v1
pedidos.messaging.insights.sales-dead-queue=pedidos360.sales.failed.v1
pedidos.messaging.insights.sales-dead-key=sales.failed.v1
spring.rabbitmq.host=${RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:pedidos360-ep3}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.health.rabbit.enabled=true
