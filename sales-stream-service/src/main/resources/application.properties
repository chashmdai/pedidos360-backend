spring.application.name=sales-stream-service
server.address=127.0.0.1
server.port=8186
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
pedidos.security.issuer=${JWT_ISSUER}
pedidos.security.audience=${JWT_AUDIENCE}
pedidos.security.jwks=${JWT_JWKS_URI}
pedidos.security.tenant=${JWT_TENANT_ID}
pedidos.security.client=${JWT_CLIENT_ID}

# Schema pedidos360_streams: separate application (DML) and migration (DDL) users, Hibernate-free JDBC.
spring.datasource.url=${STREAMS_DB_URL}
spring.datasource.username=${STREAMS_DB_USER}
spring.datasource.password=${STREAMS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${STREAMS_MIGRATION_USER}
spring.flyway.password=${STREAMS_MIGRATION_PASSWORD}

# Table 12 (common to the three groups). Group, start position, value type and concurrency are set per
# listener container factory (StreamingConfiguration) from the values below and pedidos-kafka.properties.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
pedidos.streams.consumers.sales-aggregator.concurrency=3
pedidos.streams.consumers.order-monitor.concurrency=1
pedidos.streams.consumers.sales-dashboard.concurrency=1
# Table 13: exponential backoff 1 s, 2 s (three attempts in total), then DLT.
pedidos.streams.retry.initial-interval-ms=1000
pedidos.streams.retry.multiplier=2.0
pedidos.streams.retry.max-retries=2

# Section 8.4: alert rules and bounded list of recent alerts.
pedidos.streams.alerts.high-value=50000
pedidos.streams.alerts.high-value-currency=CLP
pedidos.streams.alerts.max-lines=10
pedidos.streams.alerts.recent-limit=50
