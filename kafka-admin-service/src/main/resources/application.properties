spring.application.name=kafka-admin-service
server.address=127.0.0.1
server.port=8187
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
pedidos.security.issuer=${JWT_ISSUER}
pedidos.security.audience=${JWT_AUDIENCE}
pedidos.security.jwks=${JWT_JWKS_URI}
pedidos.security.tenant=${JWT_TENANT_ID}
pedidos.security.client=${JWT_CLIENT_ID}

# Report section 10: creation, partition increase and deletion only for disposable laboratory topics.
pedidos.kafka-admin.allowed-prefix=pedidos360.lab.
pedidos.kafka-admin.request-timeout-ms=5000
pedidos.kafka-admin.api-timeout-ms=10000
# Administration never creates business topics implicitly (no NewTopic beans are declared either).
spring.kafka.admin.auto-create=false
