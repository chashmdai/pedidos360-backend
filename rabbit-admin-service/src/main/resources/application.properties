spring.application.name=rabbit-admin-service
server.address=127.0.0.1
server.port=8184
management.endpoints.web.exposure.include=health
management.health.rabbit.enabled=false
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
pedidos.security.issuer=${JWT_ISSUER}
pedidos.security.audience=${JWT_AUDIENCE}
pedidos.security.jwks=${JWT_JWKS_URI}
pedidos.security.tenant=${JWT_TENANT_ID}
pedidos.security.client=${JWT_CLIENT_ID}
pedidos.rabbit-admin.url=${RABBIT_MANAGEMENT_URL:http://127.0.0.1:15672}
pedidos.rabbit-admin.vhost=${RABBIT_VHOST:pedidos360-ep3}
pedidos.rabbit-admin.username=${RABBIT_ADMIN_USER}
pedidos.rabbit-admin.password=${RABBIT_ADMIN_PASSWORD}
pedidos.rabbit-admin.allowed-prefix=pedidos360.lab.
