spring.application.name=order-insights-service
server.address=127.0.0.1
server.port=8185
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
pedidos.security.issuer=${JWT_ISSUER}
pedidos.security.audience=${JWT_AUDIENCE}
pedidos.security.jwks=${JWT_JWKS_URI}
pedidos.security.tenant=${JWT_TENANT_ID}
pedidos.security.client=${JWT_CLIENT_ID}
pedidos.messaging.ep4-enabled=true
pedidos.insights.directory=${INSIGHTS_DIRECTORY}
pedidos.insights.max-attempts=3
pedidos.insights.retry-delay-ms=1000
