# Single source of Kafka topic names and parameters (INFORME_EP5_EP6 tables 6 and 7),
# imported explicitly by participating services, like pedidos-rabbit.properties.
# scripts/ep5-kafka.sh reads the same keys to create/verify the topics from the CLI.

# Table 6: business topics; DLT topics are <topic> + dlt-suffix with the same partitions.
pedidos.kafka.topics.orders-registered=pedidos360.orders.registered.v1
pedidos.kafka.topics.product-metrics=pedidos360.sales.product-metrics.v1
pedidos.kafka.topics.dlt-suffix=.DLT
pedidos.kafka.topics.partitions=3
pedidos.kafka.topics.replicas=3

# Table 7: common to every topic.
pedidos.kafka.topics.min-insync-replicas=2
pedidos.kafka.topics.max-message-bytes=1048576
# Table 7: orders.registered.v1 (delete, 7 days, 1-day segments).
pedidos.kafka.topics.orders-cleanup-policy=delete
pedidos.kafka.topics.orders-retention-ms=604800000
pedidos.kafka.topics.orders-segment-ms=86400000
# Table 7: product-metrics.v1 (compact, 1-hour segments).
pedidos.kafka.topics.metrics-cleanup-policy=compact
pedidos.kafka.topics.metrics-segment-ms=3600000
pedidos.kafka.topics.metrics-min-cleanable-dirty-ratio=0.1
pedidos.kafka.topics.metrics-delete-retention-ms=86400000
# Table 7: DLT topics (delete, 14 days, 1-day segments).
pedidos.kafka.topics.dlt-cleanup-policy=delete
pedidos.kafka.topics.dlt-retention-ms=1209600000
pedidos.kafka.topics.dlt-segment-ms=86400000

# Table 10: reliable producer. Only loopback listeners of the three brokers.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094}
spring.kafka.producer.client-id=${spring.application.name}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.linger.ms=5
# JSON without Java type headers: consumers deserialize into their own fixed type.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Table 11: consumer groups of sales-stream-service (also listed by scripts/ep5-kafka.sh groups describe).
pedidos.kafka.groups.sales-aggregator=pedidos360-sales-aggregator
pedidos.kafka.groups.order-monitor=pedidos360-order-monitor
pedidos.kafka.groups.sales-dashboard=pedidos360-sales-dashboard
